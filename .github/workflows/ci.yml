name: ci

on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every module is checked on its own, the way a consumer builds it: with its
# own go.mod and the replace directives, not with the workspace.
env:
  GOWORK: "off"

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., api, auth, env, postgres, storage, tracing, app]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # A missing database fails the run instead of skipping the tests.
      REQUIRE_DB_TESTS: "1"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -shuffle=on -count=1 ./...

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., api, auth, env, postgres, storage, tracing, app]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  vulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., api, auth, env, postgres, storage, tracing, app]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A migration is refused by Migrate when it is older than one already
  # applied. Two branches adding migrations produce exactly that, when the
  # one with the earlier version merges last. This finds it on the branch,
  # where renaming the file fixes it, instead of in the deploy step.
  migrations:
    name: migration order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: New migrations sort after every migration on the base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A branch is compared with main; a push to main with what main was.
          if [ "$GITHUB_REF_NAME" = "main" ]; then base="$BEFORE"; else base="origin/main"; fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no base commit to compare with"
            exit 0
          fi

          version() { basename "$1" | sed -e 's/_.*//' -e 's/^0*//'; }

          latest=0
          for file in $(git ls-tree -r --name-only "$base" | grep -E '/migrations/[^/]+\.sql$'); do
            v="$(version "$file")"
            if [ "${v:-0}" -gt "$latest" ]; then latest="$v"; fi
          done

          status=0
          for file in $(git diff --name-only --diff-filter=A "$(git merge-base "$base" HEAD)" HEAD | grep -E '/migrations/[^/]+\.sql$'); do
            v="$(version "$file")"
            if [ "${v:-0}" -le "$latest" ]; then
              echo "::error file=$file::its version $v does not sort after $latest, the latest migration on the base: rename it with a current timestamp"
              status=1
            fi
          done
          exit $status

  # The one check main's protection requires, so adding a module to the
  # matrices never needs a settings change.
  ci:
    if: always()
    needs: [test, lint, vulncheck, docker, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
