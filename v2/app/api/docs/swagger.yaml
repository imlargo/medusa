definitions:
  github_com_imlargo_medusa_app_internal_dto.AuthResponse:
    properties:
      tokens:
        $ref: '#/definitions/github_com_imlargo_medusa_app_internal_dto.AuthTokens'
      user:
        $ref: '#/definitions/github_com_imlargo_medusa_app_internal_models.User'
    type: object
  github_com_imlargo_medusa_app_internal_dto.AuthTokens:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  github_com_imlargo_medusa_app_internal_dto.LoginWithPassword:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_imlargo_medusa_app_internal_dto.RegisterUser:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  github_com_imlargo_medusa_app_internal_models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
  httperr.Code:
    enum:
    - BAD_REQUEST
    - VALIDATION_FAILED
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - CONFLICT
    - PAYLOAD_TOO_LARGE
    - TOO_MANY_REQUESTS
    - INTERNAL_SERVER_ERROR
    - SERVICE_UNAVAILABLE
    type: string
    x-enum-varnames:
    - CodeBadRequest
    - CodeValidation
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodePayloadTooLarge
    - CodeTooManyRequests
    - CodeInternal
    - CodeServiceUnavailable
  medusa.ErrorResponse:
    properties:
      code:
        $ref: '#/definitions/httperr.Code'
      details: {}
      error:
        type: string
      request_id:
        type: string
      status:
        type: integer
    type: object
  medusa.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      request_id:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
info:
  contact:
    name: Default
    url: https://default.dev
  description: Medusa example api
  license:
    name: MIT
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Medusa
  version: "1.0"
paths:
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password
      parameters:
      - description: Credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_imlargo_medusa_app_internal_dto.LoginWithPassword'
      produces:
      - application/json
      responses:
        "200":
          description: Logged in
          schema:
            allOf:
            - $ref: '#/definitions/medusa.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_imlargo_medusa_app_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/medusa.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/medusa.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/medusa.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: Registration payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_imlargo_medusa_app_internal_dto.RegisterUser'
      produces:
      - application/json
      responses:
        "201":
          description: Registered
          schema:
            allOf:
            - $ref: '#/definitions/medusa.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_imlargo_medusa_app_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/medusa.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/medusa.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/medusa.ErrorResponse'
      summary: Register user
      tags:
      - auth
  /v1/auth/user:
    get:
      description: Get the authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: The authenticated user
          schema:
            allOf:
            - $ref: '#/definitions/medusa.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_imlargo_medusa_app_internal_models.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/medusa.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/medusa.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user info
      tags:
      - auth
securityDefinitions:
  ApiKey:
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
