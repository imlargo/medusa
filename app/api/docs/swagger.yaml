definitions:
  apperr.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  github_com_imlargo_medusa_app_internal_user.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
  httperr.Problem:
    properties:
      code:
        type: string
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/apperr.FieldError'
        type: array
      request_id:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  internal_account.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_account.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_account.Session:
    properties:
      tokens:
        $ref: '#/definitions/internal_account.Tokens'
      user:
        $ref: '#/definitions/github_com_imlargo_medusa_app_internal_user.User'
    type: object
  internal_account.Tokens:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  medusa.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      request_id:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
info:
  contact:
    name: Default
    url: https://default.dev
  description: Medusa example api
  license:
    name: MIT
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Medusa
  version: "1.0"
paths:
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password
      parameters:
      - description: Credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_account.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged in
          schema:
            allOf:
            - $ref: '#/definitions/medusa.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_account.Session'
              type: object
        "400":
          description: request.validation_failed
          schema:
            $ref: '#/definitions/httperr.Problem'
        "401":
          description: account.invalid_credentials
          schema:
            $ref: '#/definitions/httperr.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.Problem'
      summary: Login user
      tags:
      - auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: Registration payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_account.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Registered
          schema:
            allOf:
            - $ref: '#/definitions/medusa.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_account.Session'
              type: object
        "400":
          description: request.validation_failed, account.password_too_long
          schema:
            $ref: '#/definitions/httperr.Problem'
        "409":
          description: user.email_taken
          schema:
            $ref: '#/definitions/httperr.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.Problem'
      summary: Register user
      tags:
      - auth
  /v1/auth/user:
    get:
      description: Get the authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: The authenticated user
          schema:
            allOf:
            - $ref: '#/definitions/medusa.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_imlargo_medusa_app_internal_user.User'
              type: object
        "401":
          description: auth.invalid_token
          schema:
            $ref: '#/definitions/httperr.Problem'
        "404":
          description: user.not_found
          schema:
            $ref: '#/definitions/httperr.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.Problem'
      security:
      - BearerAuth: []
      summary: Get user info
      tags:
      - auth
securityDefinitions:
  ApiKey:
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
